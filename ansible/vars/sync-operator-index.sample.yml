---
# sync-operator-index vars — RHOAI disconnected BM deployment
#
# This file is the template for ansible/vars/sync-operator-index.yml.
# deploy.sh copies it (if absent) and then patches it at runtime:
#   - operator_index_tag  ← derived from --ocp-version (e.g. v4.19)
#   - catalogs_to_sync[].catalog digests ← pinned from disconnected-imageset ocp-digests.yaml
#   - additional_images   ← populated from disconnected-imageset generate scripts
#   - sync_rhoai_registries_conf ← set to true when --rhoai-fbc-image is provided
#
# Do not add images to additional_images manually — that list is overwritten by the automation.

operator_index_name: rhoai-operator-index
operator_index_tag: v4.19

# Required so oc-mirror resolves registry.redhat.io/rhoai → quay.io/rhoai.
# Auto-set to true by deploy.sh when --rhoai-fbc-image is provided.
sync_rhoai_registries_conf: true

# Redirect digest-based pulls to the bastion registry for namespaces not
# covered automatically by oc-mirror.
image_digest_mirrors:
  - source: registry.redhat.io/rhoai
    dest: rhoai
  - source: quay.io/modh
    dest: modh

catalogs_to_sync:
  # RHOAI FBC fragment — must match the --rhoai-fbc-image value passed to deploy.sh.
  # The digest is pinned here for exact reproducibility; update when changing RHOAI version.
  - catalog: quay.io/rhoai/rhoai-fbc-fragment@sha256:f7fe40ead9b1fca93b7626a3db97780577478379f1734d2f40a5ac24be233705
    target_catalog: rhoai/rhoai-operator-index
    packages:
      - name: rhods-operator
        defaultChannel: beta
        channels:
          - name: beta
            minVersion: 3.4.0-ea.2
            maxVersion: 3.4.0-ea.2

  # Red Hat operator catalog — digest pinned at deploy time from disconnected-imageset ocp-digests.yaml.
  # catalog_source_name must be redhat-operators: RHOAI operator hardcodes this name in its
  # managed dependency subscriptions (e.g. servicemeshoperator3) and reverts any changes.
  - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.19
    target_catalog: redhat/redhat-operator-index
    catalog_source_name: redhat-operators
    packages:
      - name: openshift-pipelines-operator-rh
        defaultChannel: latest
        channels:
          - name: latest
      - name: serverless-operator
        defaultChannel: stable
        channels:
          - name: stable
      - name: servicemeshoperator
        defaultChannel: stable
        channels:
          - name: stable
      - name: servicemeshoperator3
        defaultChannel: stable
        channels:
          - name: stable
            minVersion: 3.1.0
            # RHOAI operator sets startingCSV: servicemeshoperator3.v3.1.0 in its managed
            # subscription. Mirroring only newer versions causes ConstraintsNotSatisfiable.
      - name: authorino-operator
        defaultChannel: stable
        channels:
          - name: stable
          - name: tech-preview-v1
      - name: nfd
        defaultChannel: stable
        channels:
          - name: stable
      - name: cluster-observability-operator
        defaultChannel: stable
        channels:
          - name: stable
      - name: opentelemetry-product
        defaultChannel: stable
        channels:
          - name: stable
      - name: tempo-product
        defaultChannel: stable
        channels:
          - name: stable
      - name: openshift-custom-metrics-autoscaler-operator
        defaultChannel: stable
        channels:
          - name: stable

  # Community operator catalog — digest pinned at deploy time from disconnected-imageset ocp-digests.yaml.
  - catalog: registry.redhat.io/redhat/community-operator-index:v4.19
    target_catalog: redhat/community-operator-index
    catalog_source_name: community-operators
    packages:
      - name: mariadb-operator
        defaultChannel: alpha
        channels:
          - name: alpha
            minVersion: 25.8.2
            maxVersion: 25.8.2

# Populated at deploy time by deploy.sh populate_rhoai_images().
# Do not edit — overwritten on each deploy.sh run with --rhoai-fbc-image.
additional_images: []

# Sync extra container images directly with oc image mirror, allowing destination renaming.
# extra_images:
# - src: registry.redhat.io/openshift4/ztp-site-generate-rhel8:v4.21.0-2
#   dest: openshift-kni/ztp-site-generator:v4.21.0-2
# - src: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
#   dest: minio/minio:RELEASE.2025-09-07T16-13-09Z

# Redirect tag-based pulls to the bastion registry via ImageTagMirrorSet.
# Applied by mno-post-cluster-install when use_bastion_registry is true.
# image_tag_mirrors:
# - source: quay.io/rhoai
#   dest: rhoai

# Redirect digest-based pulls to the bastion registry via ImageDigestMirrorSet.
# Use this when oc-mirror does not cover a registry automatically (e.g. registry.redhat.io/rhoai).
# Applied by mno-post-cluster-install when use_bastion_registry is true.
# image_digest_mirrors:
# - source: registry.redhat.io/rhoai
#   dest: rhoai
# - source: quay.io/modh
#   dest: modh
