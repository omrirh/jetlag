---
# sync-operator-index tasks

- name: Create directories for syncing operator index
  file:
    path: "{{ item }}"
    state: directory
  loop:
  - "{{ sync_path }}"
  - "{{ sync_path }}/operators"
  - "{{ sync_path }}/operators/{{ operator_index_name }}"

- name: Write rhoai registries.conf.d entry for oc-mirror registry resolution
  copy:
    dest: /etc/containers/registries.conf.d/rhoai.conf
    content: |
      [[registry]]
      location="registry.redhat.io/rhoai"
      [[registry.mirror]]
      location="quay.io/rhoai"
  when: sync_rhoai_registries_conf | bool

- name: Create ImageSetConfiguration
  template:
    src: imagesetconf.yml.j2
    dest: "{{ sync_path }}/operators/{{ operator_index_name }}/imagesetconf.yml"

- name: Mirror operator index images
  shell: |
    oc mirror --authfile {{ registry_path }}/pull-secret-bastion.txt -c {{ sync_path }}/operators/{{ operator_index_name }}/imagesetconf.yml --workspace file://{{ sync_path }}/operators/{{ operator_index_name }} docker://{{ registry_host }}:{{ registry_port }} --v2

- name: Preserve IDMS for this operator index tag
  ansible.builtin.copy:
    src: "{{ sync_path }}/operators/{{ operator_index_name }}/working-dir/cluster-resources/idms-oc-mirror.yaml"
    dest: "{{ idms_bastion_configuration }}"
    remote_src: true

- name: Preserve CatalogSource for this operator index tag
  ansible.builtin.copy:
    src: "{{ sync_path }}/operators/{{ operator_index_name }}/working-dir/cluster-resources/{{ generated_catalogsource_name_tag }}.yaml"
    dest: "{{ catalogsource_bastion_configuration }}"
    remote_src: true

  # Older oc mirror versions may not generate the cc-* ClusterCatalog file (OLM v1),
  # and nothing currently applies it to the cluster, so a missing file is not fatal.
- name: Preserve ClusterCatalog for this operator index tag
  ansible.builtin.copy:
    src: "{{ sync_path }}/operators/{{ operator_index_name }}/working-dir/cluster-resources/{{ generated_clustercatalog_name_tag }}.yaml"
    dest: "{{ clustercatalog_bastion_configuration }}"
    remote_src: true
  ignore_errors: true

- name: Mirror extra images with renaming support
  shell: |
    oc image mirror -a {{ registry_path }}/pull-secret-bastion.txt {{ item.src }} {{ registry_host }}:{{ registry_port }}/{{ item.dest }} --keep-manifest-list --continue-on-error=true
  loop: "{{ extra_images | default([]) }}"
- name: Query bastion registry for actual tags of mirrored catalog indexes
  uri:
    url: "https://{{ registry_host }}:{{ registry_port }}/v2/{{ item.target_catalog }}/tags/list"
    user: "{{ registry_user }}"
    password: "{{ registry_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: catalog_tag_query
  loop: "{{ catalogs_to_sync | selectattr('target_catalog', 'defined') | list }}"
  when: catalogs_to_sync | selectattr('target_catalog', 'defined') | list | length > 0

- name: Build catalog source definitions from registry query results
  set_fact:
    catalog_source_defs: "{{ catalog_source_defs | default([]) + [new_entry] }}"
  vars:
    # Filter to tags matching the current operator_index_tag prefix (e.g. v4.19) so re-syncs
    # don't pick up stale tags from previous OCP-version runs. Fall back to tags[0] if none match.
    matching_tags: "{{ item.json.tags | select('match', '^' + operator_index_tag) | list }}"
    selected_tag: "{{ matching_tags[-1] if matching_tags | length > 0 else item.json.tags[0] }}"
    new_entry:
      name: "{{ item.item.catalog_source_name | default(item.item.target_catalog | replace('/', '-')) }}"
      image: "{{ registry_host }}:{{ registry_port }}/{{ item.item.target_catalog }}:{{ selected_tag }}"
      display_name: "{{ item.item.catalog_source_name | default(item.item.target_catalog | split('/') | last) }}"
  loop: "{{ catalog_tag_query.results }}"
  when: catalog_tag_query is not skipped and catalog_tag_query.results is defined

- name: Generate catalog-sources.yaml for multi-catalog operator sync
  template:
    src: catalog-sources.yaml.j2
    dest: "{{ sync_path }}/operators/{{ operator_index_name }}/working-dir/cluster-resources/catalog-sources.yaml"
  when: catalog_source_defs is defined and catalog_source_defs | length > 0
